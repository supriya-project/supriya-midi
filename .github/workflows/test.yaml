name: Test

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  schedule:
  - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.15"
    - name: Install supriya-midi
      run: uv sync
    - name: Run prek
      uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1

  # N.B. /dev/snd/seq isn't available on the Ubuntu runner and I haven't
  # succeeded in spinning up a nested Multipass VM so we'll just test OSX and
  # Windows.
  #
  # See also: https://github.com/Jajcus/python-alsa-midi/blob/main/.github/workflows/ci.yml#L65-L98
  # but copying the Multipass steps here fails when starting the VM. Can't tell why.
  test:
    name: Test
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.15"
    - name: Sync
      run: uv sync
    - name: Install
      run: uv pip install -e . -v
    - name: Test
      run: uv run pytest -v
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]

  build-docs:
    name: Build docs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.15"
    - name: Sync
      run: uv sync
    - name: Build docs
      run: uv run make -C docs html

  build-sdist:
    name: Build source distribution
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.15"
    - name: Install supriya-midi
      run: uv sync
    - name: Build sdist
      run: uv build --sdist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-sdist
        path: dist/*.tar.gz

  build-wheels:
    name: Build wheels
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - name: Build wheels
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_BUILD: ${{ matrix.build }}
      uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
    - name: Upload wheels
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-${{ matrix.dist }}
        path: ./wheelhouse/*.whl
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: macos-26,         arch: x86_64, build: "cp3{11,12,13,14,15}-*",          dist: macos-amd}
        - {os: macos-26,         arch: arm64,  build: "cp3{11,12,13,14,15}-*",          dist: macos-arm}
        - {os: ubuntu-24.04,     arch: auto,   build: "cp3{11,12,13,14,15}-manylinux*", dist: manylinux-amd}
        - {os: ubuntu-24.04,     arch: auto,   build: "cp3{11,12,13,14,15}-musllinux*", dist: musllinux-amd}
        - {os: ubuntu-24.04-arm, arch: auto,   build: "cp3{11,12,13,14,15}-manylinux*", dist: manylinux-arm}
        - {os: ubuntu-24.04-arm, arch: auto,   build: "cp3{11,12,13,14,15}-musllinux*", dist: musllinux-arm}
        - {os: windows-latest,   arch: AMD64,  build: "cp3{11,12,13,14,15}-*",          dist: windows-amd}
        - {os: windows-11-arm,   arch: ARM64,  build: "cp3{11,12,13,14,15}-*",          dist: windows-arm}

  test-wheels:
    name: Test wheels
    needs: build-wheels
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.15"
    - name: Download wheels
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist-${{ matrix.dist }}
        path: dist
    - name: List wheels
      run: ls -l dist/
    - name: Install wheel
      run: pip install ./dist/*cp315*
      shell: bash
    - name: Install pytest
      run: pip install pytest pytest-cov
    - name: Test
      run: pytest -v
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: macos-26,         dist: macos-arm}
        - {os: windows-latest,   dist: windows-amd}
        # See above...
        # /dev/snd/seq is not available on ubuntu runners :/
        # - {os: ubuntu-24.04,     dist: manylinux-amd}
        # - {os: ubuntu-24.04-arm, dist: manylinux-arm}
