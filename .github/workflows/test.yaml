name: Test

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  schedule:
  - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.14"
    - name: Install supriya-midi
      run: uv sync
    - name: Format check
      run: uv run ruff format --check src/ tests/
    - name: Lint
      run: uv run ruff check src/ tests/
    - name: Type check
      run: uv run ty check src/ tests/

  # N.B. /dev/snd/seq isn't available on the Ubuntu runner and I haven't
  # succeeded in spinning up a nested Multipass VM so we'll just test OSX and
  # Windows.
  #
  # See also: https://github.com/Jajcus/python-alsa-midi/blob/main/.github/workflows/ci.yml#L65-L98
  # but copying the Multipass steps here fails when starting the VM. Can't tell why.
  test:
    name: Test
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.14"
    - name: Sync
      run: uv sync
    - name: Pip install
      run: uv pip install -e . -v
    - name: Test
      run: uv run pytest -v
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]

  build-docs:
    name: Build docs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.14"
    - name: Sync
      run: uv sync
    - name: Build docs
      run: uv run make -C docs html

  build-wheels:
    name: Build wheels
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - name: Build wheels
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_BUILD: ${{ matrix.build }}
      uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: macos-26,         arch: x86_64, build: "cp3{10,11,12,13,14}-*",          dist: macos-amd}
        - {os: macos-26,         arch: arm64,  build: "cp3{10,11,12,13,14}-*",          dist: macos-arm}
        - {os: ubuntu-24.04,     arch: auto,   build: "cp3{10,11,12,13,14}-manylinux*", dist: manylinux-amd}
        - {os: ubuntu-24.04,     arch: auto,   build: "cp3{10,11,12,13,14}-musllinux*", dist: musllinux-amd}
        - {os: ubuntu-24.04-arm, arch: auto,   build: "cp3{10,11,12,13,14}-manylinux*", dist: manylinux-arm}
        - {os: ubuntu-24.04-arm, arch: auto,   build: "cp3{10,11,12,13,14}-musllinux*", dist: musllinux-arm}
        - {os: windows-latest,   arch: AMD64,  build: "cp3{10,11,12,13,14}-*",          dist: windows-amd}
        - {os: windows-11-arm,   arch: ARM64,  build: "cp3{10,11,12,13,14}-*",          dist: windows-arm}
