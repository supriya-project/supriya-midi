name: Publish
on:
  release:
    types: [released]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  build-docs:
    name: Build docs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.14"
    - name: Sync
      run: uv sync
    - name: Build docs
      run: uv run make -C docs html
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ./docs/build/html/

  build-sdist:
    name: Build distribution archives
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.14"
    - name: Build sdist
      run: uv build --sdist
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-sdist
        path: dist/*.tar.gz

  build-wheels:
    name: Build wheels
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - name: Build wheels
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_BUILD: ${{ matrix.build }}
      uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
    - name: Upload wheels
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ matrix.dist }}
        path: ./wheelhouse/*.whl
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: macos-15,         arch: x86_64, build: "cp3{10,11,12,13,14}-*",          dist: macos-amd}
        - {os: macos-15,         arch: arm64,  build: "cp3{10,11,12,13,14}-*",          dist: macos-arm}
        - {os: ubuntu-24.04,     arch: auto,   build: "cp3{10,11,12,13,14}-manylinux*", dist: manylinux-amd}
        - {os: ubuntu-24.04,     arch: auto,   build: "cp3{10,11,12,13,14}-musllinux*", dist: musllinux-amd}
        - {os: ubuntu-24.04-arm, arch: auto,   build: "cp3{10,11,12,13,14}-manylinux*", dist: manylinux-arm}
        - {os: ubuntu-24.04-arm, arch: auto,   build: "cp3{10,11,12,13,14}-musllinux*", dist: musllinux-arm}
        - {os: windows-latest,   arch: AMD64,  build: "cp3{10,11,12,13,14}-*",          dist: windows-amd}
        - {os: windows-11-arm,   arch: ARM64,  build: "cp3{10,11,12,13,14}-*",          dist: windows-arm}

  upload-to-testpypi:
    name: Publish release to Test PyPI
    environment: testpypi
    needs: [build-wheels, build-sdist]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        merge-multiple: true
        path: dist
        pattern: dist-*
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/

  upload-to-pypi:
    name: Publish release to PyPI
    environment: pypi
    needs: [build-wheels, build-sdist, upload-to-testpypi]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        merge-multiple: true
        path: dist
        pattern: dist-*
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  update-gh-pages:
    name: Update gh-pages
    environment:
      name: github-pages
    needs: [upload-to-pypi]
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
